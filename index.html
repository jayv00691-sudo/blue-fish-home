<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="萌宠集体小窝：走进角色大厅，选择一位小伙伴的房间。" />
    <title>萌宠集体小窝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="landing" id="landing" aria-label="欢迎页">
        <div class="landing-art" aria-hidden="true">
          <div class="sparkle sparkle-one">✦</div>
          <div class="sparkle sparkle-two">✦</div>
          <div class="moon">☾</div>
          <div class="animal">🐰</div>
          <div class="grass">〰 〰 〰</div>
        </div>

        <button class="landing-title" id="enter-hall" type="button" aria-label="点击进入集体大厅">
          <span class="title-kicker">MOMO PET COMMUNITY</span>
          <strong>萌宠集体小窝</strong>
          <span class="title-hint">点击进入集体大厅 <i aria-hidden="true">↗</i></span>
        </button>
      </section>

      <section class="hall hidden" id="hall" aria-labelledby="hall-title">
        <header class="hall-header">
          <div>
            <p class="eyebrow">WELCOME TO THE HALL</p>
            <h1 id="hall-title">集体大厅</h1>
            <p class="hall-intro">选择一位住户，进入它的小窝。</p>
          </div>
          <button class="back-button" id="back-home" type="button">← 返回封面</button>
        </header>
        <div class="resident-grid" id="resident-grid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
